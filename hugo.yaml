baseURL: https://reisub.eu/
locale: en-us
title: "reisub"
paginate: 5
copyright: "© 2026 Rudolf D. Frank"
theme: ["PaperMod"]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

languages:
  en:
    languageName: "EN"
    weight: 1
    taxonomies:
      tag: tags
#      category: categories
      series: series
    menu:
      main:
        - name: posts
          url: posts
          weight: 1
        - name: archives
          url: archives
          weight: 2
        - name: search
          url: search/
          weight: 2
        - name: tags
          url: tags/
          weight: 4
        - name: noteworthy
          url: shared
          weight: 5

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: reisub
  description: "Self-hosting, linux, devops, geeking around..."
  keywords: [blog, linux, devops, self-hosting, homelab, geek]
  author: rudfrank
  # author: ["Me", "You"] # multiple authors
  DateFormat: "2006-01-02"

  defaultTheme: dark
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  disableSpecial1stPost: false
  displayFullLangName: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: true
    title: "reisub<blink>_</blink>"
    subtitle: "``# Have you tried turning off and on again?``"
    imageUrl: "images/avatar.png"
    imageTitle: avatar
    imageWidth: 256
    imageHeight: 256
    buttons:
      - name: posts
        url: posts
      - name: archives
        url: archives
      - name: noteworthy
        url: shared

  socialIcons:
    - name: github
      title: Github
      url: "https://github.com/rudfrank/reisub"
    - name: Linkedin
      title: Find me on Linkedin
      url: "https://www.linkedin.com/in/rudolffrank"

  editPost:
    URL: "https://github.com/rudfrank/reisub/edit/master/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # label:
  # iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" height="25" viewBox="0 -960 960 960" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>'
  # text: "Home"
  # icon: icon.png
  # iconHeight: 35

  # analytics:
  #     google:
  #         SiteVerificationTag: "XYZabc"

  assets:
    disableHLJS: true
  #     favicon: "<link / abs url>"
  #     favicon16x16: "<link / abs url>"
  #     favicon32x32: "<link / abs url>"
  #     apple_touch_icon: "<link / abs url>"
  #     safari_pinned_tab: "<link / abs url>"

  cover:
      hidden: true # hide everywhere but not in structured data
      hiddenInList: true # hide on list pages and home
      hiddenInSingle: true # hide on single page

  fuseOpts:
      isCaseSensitive: false
      shouldSort: true
      location: 0
      distance: 1000
      threshold: 0.4
      minMatchCharLength: 0
      keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

privacy:
  vimeo:
    disabled: false
    simple: true

  twitter:
    disabled: false
    enableDNT: true
    simple: true

  instagram:
    disabled: false
    simple: true

  youtube:
    disabled: false
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true

security:
  funcs:
    getenv:
      - '^MINIFLUX_TOKEN$'
      - '^HUGO_'

minify: 
  disableXML: true  # (Default: false)
  minifyOutput: true  # (Default: false)

caches:
  images:
    dir: :cacheDir/images
